[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resize-energy"
version = "0.1.0"
description = "RESize: a step-by-step tutor for sizing renewable energy systems (students and preliminary design)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matteo Mazzanti" }]
keywords = ["renewable energy", "photovoltaic", "sizing", "education", "hydrogen"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "openpyxl>=3.1"]
pv = ["pvlib>=0.10"]
ai = ["keyring>=24"]  # optional: remember the API key in the system keyring
dev = ["pytest>=8", "ruff>=0.5", "openpyxl>=3.1"]

[project.scripts]
resize-cli = "resize_energy.cli:main"

[project.gui-scripts]
resize = "resize_energy.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resize_energy = ["data/*.json", "data/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the rule set so lint results do not change with the ruff version.
select = ["E4", "E7", "E9", "F", "I", "B"]

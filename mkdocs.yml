site_name: RESize
site_description: A step-by-step tutor for sizing renewable energy systems
site_url: https://matteomazzanti99.github.io/RESize/
repo_url: https://github.com/MatteoMazzanti99/RESize
repo_name: MatteoMazzanti99/RESize
docs_dir: docs
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: green
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: green
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Install: install.md
  - References: references.md
  - User guide:
      - How to read the results: guide/concepts.md
      - Photovoltaic: guide/pv.md
      - Wind: guide/wind.md
      - Biomass: guide/biomass.md
      - Green hydrogen: guide/hydrogen.md
      - Battery storage: guide/battery.md
      - Solar thermal and cooling: guide/solar-thermal.md
      - Hydropower: guide/hydro.md
      - Geothermal: guide/geothermal.md
      - Ground-source heat pump: guide/ground-source.md
      - Technology comparison: guide/compare.md
  - Validation:
      - Overview: validation/README.md
      - PV sizing: validation/pv.md
      - Wind sizing: validation/wind.md
      - Borehole field: validation/bhe.md

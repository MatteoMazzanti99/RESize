name: PV validation

on:
  workflow_dispatch:
  push:
    paths: ["validation/**", "src/resize_energy/core/**", ".github/workflows/validation.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Compare with PVGIS
        shell: bash
        run: |
          set +e
          python validation/validate_pv.py --out pv-report.md > out.txt 2>&1
          code=$?
          cat out.txt >> "$GITHUB_STEP_SUMMARY"
          # one annotation with the whole report (annotations are capped at 10 per step)
          body=$(python -c "import urllib.parse;print(urllib.parse.quote(open('out.txt').read(),safe=' |/:.,()-+=*#'))")
          echo "::notice title=PV validation report::${body}"
          exit $code
      - name: Wind checks and NASA POWER
        shell: bash
        run: |
          set +e
          python validation/validate_wind.py --out wind-report.md > wind.txt 2>&1
          code=$?
          cat wind.txt >> "$GITHUB_STEP_SUMMARY"
          body=$(python -c "import urllib.parse;print(urllib.parse.quote(open('wind.txt').read()[-3500:],safe=' |/:.,()-+=*#'))")
          echo "::notice title=Wind validation report::${body}"
          exit $code
      - name: Cross-checks of all technologies (pvlib, PyWake)
        shell: bash
        run: |
          set +e
          pip install pvlib py_wake > pip.txt 2>&1 || tail -5 pip.txt
          python validation/validate_cross.py --out cross-report.md > cross.txt 2>&1
          code=$?
          cat cross.txt >> "$GITHUB_STEP_SUMMARY"
          body=$(python -c "import urllib.parse;print(urllib.parse.quote(open('cross.txt').read()[-3500:],safe=' |/:.,()-+=*#'))")
          echo "::notice title=Cross-check report::${body}"
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            pv-report.md
            wind-report.md
            cross-report.md
